# SautiYetu — nginx site config
# Frontend static build served at "/", API proxied at "/api/".
# Replace sautiyetu.example.com with your domain.

server {
    listen 80;
    server_name sautiyetu.example.com;

    root /var/www/sautiyetu;
    index index.html;

    # Static frontend + SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60m;   # PDF uploads up to 60 MB
    }
}
